services:
  - type: web
    name: setu-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: setu-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://setu-frontend.vercel.app,https://setu.vercel.app,https://setu-backend.onrender.com,*"
      - key: PYTHONPATH
        value: "backend"

databases:
  - name: setu-postgres
    databaseName: setu_db
    user: setu_user

